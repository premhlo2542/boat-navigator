<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06121f">
<meta name="description" content="Boat Navigator — แอปนำทางเรือแบบ PWA ใช้ GPS ของอุปกรณ์">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boat Nav">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Boat Navigator</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 3 3 5.5v15L9 18l6 2.5 6-2.5v-15L15 5.5z"/><path d="M9 3v15M15 5.5v15"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-pinplus" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><path d="M12 6.8v5.4M9.3 9.5h5.4"/></symbol>
    <symbol id="i-trips" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-anchor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M7.5 11h9M4 15a8 8 0 0 0 16 0"/></symbol>
    <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" fill="currentColor"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></symbol>
    <symbol id="i-nav" viewBox="0 0 24 24"><path d="M12 3 5 20l7-4 7 4z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.3v.2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.3v.2"/></symbol>
    <symbol id="i-wifioff" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 8.8A11 11 0 0 0 2 12M5.5 13a7 7 0 0 1 3.6-2.3M12 19.5v.1M16 11.5a7 7 0 0 1 2.5 1.5M22 12a11 11 0 0 0-8.5-3.9"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-north" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 4.5 15.5 12h-7z" fill="currentColor"/><path d="M8.5 12 12 19.5 15.5 12" opacity=".45"/></symbol>
    <symbol id="i-satellite" viewBox="0 0 24 24"><path d="M12 12a4 4 0 0 1 4 4M12 8a8 8 0 0 1 8 8M12 4a12 12 0 0 1 12 12" transform="translate(-2 2)"/><circle cx="5" cy="19" r="1.5" fill="currentColor"/></symbol>
  </defs>
</svg>

<div id="map" aria-label="แผนที่นำทาง"></div>

<header id="topbar">
  <button id="searchBtn" class="pill" aria-label="ค้นหาสถานที่"><svg class="ic"><use href="#i-search"/></svg><span>ค้นหาสถานที่ ท่าเรือ เกาะ อ่าว…</span></button>
  <button id="gpsChip" class="chip" aria-label="สถานะ GPS"></button>
</header>
<div id="alerts" aria-live="assertive"></div>
<div id="pickbar" hidden></div>

<div id="controls">
  <button class="fab" id="btnZoomIn" aria-label="ซูมเข้า"><svg class="ic"><use href="#i-plus"/></svg></button>
  <button class="fab" id="btnZoomOut" aria-label="ซูมออก"><svg class="ic"><use href="#i-minus"/></svg></button>
  <button class="fab" id="btnAnchor" aria-label="Anchor Watch"><svg class="ic"><use href="#i-anchor"/></svg></button>
  <button class="fab" id="btnRec" aria-label="บันทึกเส้นทาง"><svg class="ic"><use href="#i-rec"/></svg></button>
  <button class="fab" id="btnSave" aria-label="บันทึกตำแหน่งปัจจุบันเป็น Waypoint"><svg class="ic"><use href="#i-pinplus"/></svg></button>
  <button class="fab" id="btnCompass" aria-label="หมุนแผนที่ตามหัวเรือ"><svg class="ic"><use href="#i-north"/></svg></button>
  <button class="fab big" id="btnFollow" aria-label="กลับไปตำแหน่งเรือ / ติดตามอัตโนมัติ"><svg class="ic"><use href="#i-locate"/></svg></button>
</div>

<div id="pointSheet" class="sheet" hidden></div>
<div id="hud"></div>

<main id="page" hidden></main>

<nav id="tabs" aria-label="เมนูหลัก">
  <button data-tab="map" class="on"><svg class="ic"><use href="#i-map"/></svg><span>แผนที่</span></button>
  <button data-tab="routes"><svg class="ic"><use href="#i-route"/></svg><span>เส้นทาง</span></button>
  <button data-tab="places"><svg class="ic"><use href="#i-pin"/></svg><span>สถานที่</span></button>
  <button data-tab="trips"><svg class="ic"><use href="#i-trips"/></svg><span>ทริป</span></button>
  <button data-tab="settings"><svg class="ic"><use href="#i-settings"/></svg><span>ตั้งค่า</span></button>
</nav>

<section id="search" hidden></section>
<div id="overlay"><div class="spinner"></div><p>กำลังโหลด…</p></div>
<div id="modal" hidden></div>
<div id="toasts"></div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/leaflet-rotate.js"></script>
<script type="module" src="js/main.js"></script>
<noscript>แอปนี้ต้องใช้ JavaScript</noscript>
</body>
</html>
